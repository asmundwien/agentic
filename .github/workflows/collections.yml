name: Generate collections

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: generate-collections
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the artifact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: artifact

      - name: Read source main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: asmundwien/agentic-src
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install collection tooling
        run: npm install --global --ignore-scripts rulesync@43.6.0

      - name: Assemble collections at locked revisions
        run: bash artifact/.github/scripts/generate-collections.sh source "$RUNNER_TEMP/collections"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update generated content on main
        working-directory: artifact
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            "$RUNNER_TEMP/collections/" ./
          git add --all
          if git diff --cached --quiet; then
            echo 'Generated content is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Generate collections from $(git -C ../source rev-parse HEAD)"
          git push origin HEAD:main
